[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "perdiem"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openpyxl==3.1.5",
    "requests==2.32.3",
    "numpy==1.26.4",
    "opencv-python-headless==4.10.0.84",
    "Pillow==10.4.0",
    "pytesseract==0.3.13",
    "PyMuPDF==1.24.14",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.0.0",
    "ruff==0.9.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["perdiem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
